<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Omnia Nightclub — upcoming shows</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#000}
a{color:#67e8f9}a:hover{color:#a5f3fc}
.hero{position:relative;isolation:isolate;padding-bottom:72px !important;margin-bottom:-40px}.hero::before{content:"";position:absolute;inset:0;z-index:-1;background-image:linear-gradient(to bottom,rgba(0,0,0,0.45),rgba(0,0,0,0.05) 35%),url(/_blob/81f58da856b478a94d1c471e5bad2769);background-size:cover;background-position:center;-webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 45%,rgba(0,0,0,0.6) 70%,transparent 100%);mask-image:linear-gradient(to bottom,#000 0%,#000 45%,rgba(0,0,0,0.6) 70%,transparent 100%)}
.grad{background:linear-gradient(to right,#22d3ee,#a855f7,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent}
.glass{backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
.row{transition:transform .5s ease,background-color .5s ease,border-color .5s ease}
.row:hover{transform:translateY(-4px);border-color:rgba(6,182,212,.3);background-color:rgba(255,255,255,.15)}
.btn{transition:box-shadow .3s ease,border-color .3s ease}
.btn:hover{border-color:rgba(255,255,255,.4);box-shadow:0 0 15px rgba(139,92,246,.5);color:#fff}
.alink{color:#e2e8f0;text-decoration:none}
.alink:hover{color:#a5f3fc;text-decoration:underline;text-underline-offset:4px}
</style>
</helmet>
<div style="min-height: 1080px; background: linear-gradient(to bottom right, #581c87, #312e81, #000000); color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; box-sizing: border-box">

  <section class="hero" style="padding: 0 0 32px">
    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 24px; padding: 12px 28px; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; text-shadow: 0 1px 3px rgba(0,0,0,0.6)">
      <p style="margin: 0; display: inline-flex; align-items: center; gap: 8px; min-height: 32px; box-sizing: border-box; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.2); background: rgba(15,10,35,0.55); color: rgba(226,232,240,0.9); text-shadow: none"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 8px rgba(74,222,128,0.8)"></span>Shows updated [last_updated]</p>
      <nav aria-label="Primary" style="display: flex; gap: 10px">
        <a href="#" class="btn" style="color: rgba(226,232,240,0.9); text-decoration: none; min-height: 40px; box-sizing: border-box; padding: 0 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.2); background: rgba(15,10,35,0.55); text-shadow: none; display: inline-flex; align-items: center">about</a>
        <a href="#" class="btn" style="color: rgba(226,232,240,0.9); text-decoration: none; min-height: 40px; box-sizing: border-box; padding: 0 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.2); background: rgba(15,10,35,0.55); text-shadow: none; display: inline-flex; align-items: center">contact</a>
      </nav>
    </div>

    <div style="max-width: 1280px; margin: 0 auto; padding: 8px 24px 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
      <a href="Main.dc.html" style="align-self: flex-start; min-height: 44px; display: inline-flex; align-items: center; gap: 8px; color: #e2e8f0; text-decoration: none; font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; text-shadow: 0 1px 3px rgba(0,0,0,0.6)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="M11 18l-6-6 6-6"></path></svg>
        All venues
      </a>
      <div style="display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; flex-wrap: wrap; gap: 8px">
          <span style="font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; padding: 4px 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.3); background: rgba(15,10,35,0.6)">Nightclub</span>
          <span style="font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; padding: 4px 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.3); background: rgba(15,10,35,0.6)">Caesars Palace</span>
        </div>
        <h1 class="grad" style="margin: 0; font-size: 60px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.05">Omnia Nightclub</h1>
        <div style="font-size: 18px; font-weight: 600; text-shadow: 0 1px 3px rgba(0,0,0,0.6)">33 headliner nights through Dec 31 · Next: Fri, Oct 16 — Steve Aoki</div>
      </div>
    </div>
  </section>

  <div style="position: relative; max-width: 1280px; margin: 0 auto; padding: 8px 24px 56px; box-sizing: border-box">
    <div aria-hidden="true" style="position: absolute; inset: 0; overflow: hidden; pointer-events: none">
      <div style="position: absolute; top: 8%; left: 18%; width: 256px; height: 256px; border-radius: 50%; background: #22d3ee; opacity: 0.5; filter: blur(24px)"></div>
      <div style="position: absolute; bottom: 12%; right: 22%; width: 320px; height: 320px; border-radius: 50%; background: #f472b6; opacity: 0.5; filter: blur(24px)"></div>
      <div style="position: absolute; top: 52%; left: 34%; width: 192px; height: 192px; border-radius: 50%; background: #c084fc; opacity: 0.5; filter: blur(24px)"></div>
    </div>

    <div style="position: relative; display: flex; flex-direction: column; gap: 18px">
      <div role="group" aria-label="Filter by artist" style="display: flex; flex-wrap: wrap; gap: 10px">
        <sc-for list="{{chips}}" as="c" hint-placeholder-count="8">
          <button class="btn" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}<span style="font-size: 13px; opacity: 0.8">×{{c.count}}</span></button>
        </sc-for>
      </div>

      <main class="glass" style="border: 1px solid rgba(255,255,255,0.3); border-radius: 12px; background: rgba(255,255,255,0.15); padding: 20px; box-sizing: border-box">
        <div style="display: flex; flex-direction: column; gap: 10px">
          <sc-for list="{{events}}" as="e" hint-placeholder-count="10">
            <div class="row glass" style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 14px 16px; border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; background: rgba(255,255,255,0.1); text-transform: capitalize">
              <div style="flex: 0 0 120px">
                <div style="font-size: 28px; font-weight: 800; display: flex; gap: 10px"><span>{{e.mon}}</span><span>{{e.day}}</span></div>
                <div style="display: flex; align-items: baseline; gap: 10px"><span style="font-weight: 500">{{e.wd}}</span><span style="font-size: 14px">2026</span></div>
              </div>
              <div style="flex: 1 1 240px; min-width: 0; display: flex; flex-direction: column; gap: 6px">
                <a class="alink" href="{{e.href}}" style="align-self: flex-start; font-size: 22px; font-weight: 700; letter-spacing: 0.05em">{{e.artist}}</a>
                <sc-if value="{{e.hasTag}}" hint-placeholder-val="{{false}}">
                  <span style="align-self: flex-start; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; padding: 3px 10px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.25); background: rgba(15,10,35,0.5)">{{e.tag}}</span>
                </sc-if>
              </div>
              <a class="btn" href="{{e.url}}" style="min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center; gap: 8px; padding: 0 16px; border: 1px solid rgba(255,255,255,0.2); border-radius: 999px; background: rgba(255,255,255,0.1); color: #e2e8f0; text-decoration: none; font-size: 14px; font-weight: 700; text-transform: none">View event
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7"></path><path d="M8 7h9v9"></path></svg>
              </a>
            </div>
          </sc-for>
        </div>
      </main>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1400}}'>
class Component extends DCLogic {
  renderVals() {
    const pick = (this.state && this.state.artist) || 'all';
    const T = 'https://taogroup.com/event/';
    const ev = (mon, day, wd, artist, tag, url) => ({ mon, day, wd, artist, tag, hasTag: !!tag, url: T + url, href: artist === 'steve aoki' ? 'Artist.dc.html' : '#' });
    const all = [
      ev('oct', 16, 'friday', 'steve aoki', '', '10-16-2026-steve-aoki-omnia/'),
      ev('oct', 17, 'saturday', 'zedd', '', '10-17-2026-steve-aoki-omnia/'),
      ev('oct', 20, 'tuesday', 'mikey francis', '', '10-20-2026-omnia-nightclub-tuesday-omnia-nightclub/'),
      ev('oct', 23, 'friday', 'steve aoki', '', '10-23-2026-steve-aoki-omnia/'),
      ev('oct', 24, 'saturday', 'zedd', '', '10-24-2026-zedd-omnia/'),
      ev('oct', 25, 'sunday', 'jaÿ-z', 'ace of spades 20th anniversary', '10-25-2026-jay-z-omnia-nightclub/'),
      ev('oct', 27, 'tuesday', 'alesso', 'roads of fury', '10-27-2026-alesso-omnia-nightclub/'),
      ev('oct', 30, 'friday', 'tiësto', 'halloween weekend', '10-30-2026-omnia-nightclub-friday-omnia/'),
      ev('oct', 31, 'saturday', 'martin garrix', 'w/ justin mylo · halloween weekend', '10-31-2026-martin-garrix-omnia-nightclub/'),
      ev('nov', 3, 'tuesday', 'steve aoki', '', '11-3-2026-omnia-nightclub-tuesday-omnia-nightclub/'),
      ev('nov', 6, 'friday', 'martin garrix', 'w/ justin mylo', '11-6-2026-martin-garrix-omnia/'),
      ev('nov', 7, 'saturday', 'chris lake', '', '11-7-2026-chris-lake-omnia-nightclub/'),
      ev('nov', 10, 'tuesday', 'rob guson', '', '11-10-2026-omnia-nightclub-tuesday-omnia-nightclub/'),
      ev('nov', 13, 'friday', 'steve aoki', 'designercon kick off party', '11-13-2026-steve-aoki-omnia-nightclub/'),
      ev('nov', 14, 'saturday', 'alesso', '', '11-14-2026-alesso-omnia-nightclub/'),
      ev('nov', 17, 'tuesday', 'mikey francis', '', '11-17-2026-omnia-nightclub-tuesday-omnia-nightclub/'),
      ev('nov', 19, 'thursday', 'alesso', 'race weekend', '11-19-2026-alesso-omnia-nightclub/'),
      ev('nov', 20, 'friday', 'martin garrix', 'w/ justin mylo · race weekend', '11-20-2026-martin-garrix-omnia/'),
      ev('nov', 21, 'saturday', 'tiësto', 'race weekend', '11-21-2026-omnia-nightclub-saturday-omnia/'),
      ev('nov', 24, 'tuesday', 'dj shift', '', '11-24-2026-omnia-nightclub-tuesday-omnia-nightclub/'),
      ev('nov', 27, 'friday', 'rob guson', 'thanksgiving weekend', '11-27-2026-omnia-nightclub-friday-omnia-nightclub/'),
      ev('dec', 1, 'tuesday', 'steve aoki', '', '12-1-2026-steve-aoki-omnia-nightclub/'),
      ev('dec', 4, 'friday', 'alesso', '', '12-4-2026-omnia-nightclub-friday-omnia/'),
      ev('dec', 5, 'saturday', 'zedd', '', '12-5-2026-zedd-omnia/'),
      ev('dec', 11, 'friday', 'twinsick', '', '12-11-2026-twinsick-omnia-nightclub/'),
      ev('dec', 12, 'saturday', 'alesso', '', '12-12-2026-alesso-omnia-nightclub/'),
      ev('dec', 15, 'tuesday', 'rob guson', '', '12-15-2026-omnia-nightclub-tuesday-omnia-nightclub/'),
      ev('dec', 18, 'friday', 'steve aoki', '', '12-18-2026-omnia-nightclub-friday-omnia-nightclub/'),
      ev('dec', 19, 'saturday', 'illenium', '', '12-19-2026-illenium-omnia-nightclub/'),
      ev('dec', 22, 'tuesday', 'mikey francis', '', '12-22-2026-omnia-nightclub-tuesday-omnia-nightclub/'),
      ev('dec', 26, 'saturday', 'mashbit', 'lvp party 2026', '12-26-2026-lvp-party-2026-feat-mashbit-omnia-nightclub/'),
      ev('dec', 29, 'tuesday', 'luis torres', '', '12-29-2026-omnia-nightclub-tuesday-omnia-nightclub/'),
      ev('dec', 31, 'thursday', 'steve aoki', "new year's eve", '12-31-2026-steve-aoki-omnia-nightclub/')
    ];
    const base = 'min-height: 44px; padding: 0 18px; border-radius: 999px; font: inherit; font-size: 15px; font-weight: 700; text-transform: capitalize; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; color: #e2e8f0; border: 1px solid rgba(255,255,255,0.2);';
    const on = base + ' background: linear-gradient(to right, rgba(6,182,212,0.8), rgba(147,51,234,0.8));';
    const off = base + ' background: rgba(15,10,35,0.6);';
    const chip = (id, label, count) => ({ label, count, pressed: pick === id ? 'true' : 'false', style: pick === id ? on : off, pick: () => this.setState({ artist: id }) });
    return {
      chips: [
        chip('all', 'all artists', all.length),
        chip('steve aoki', 'steve aoki', 7),
        chip('alesso', 'alesso', 5),
        chip('zedd', 'zedd', 3),
        chip('martin garrix', 'martin garrix', 3),
        chip('mikey francis', 'mikey francis', 3),
        chip('rob guson', 'rob guson', 3),
        chip('tiësto', 'tiësto', 2)
      ],
      events: pick === 'all' ? all : all.filter((e) => e.artist === pick)
    };
  }
}
</script>
</body>
</html>
